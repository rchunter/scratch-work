title: Suspicious PowerShell Download Cradle
id: 3b6ab547-1503-4a73-8a67-1d2f2b970b32
status: test
description: Detects PowerShell commands commonly used to download and execute payloads
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
      - "powershell"
      - "IEX"
      - "Net.WebClient"
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1059.001
